[project]
name = "taiwanese-politics-research"
version = "0.1.0"
description = "Replication code: national identity versus class in Taiwanese party identification (TSCS 2012-2014)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "catboost>=1.2.10",
    "matplotlib>=3.11.0",
    "pandas>=3.0.4",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
